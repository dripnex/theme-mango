  <text x="942" y="26" text-anchor="end" fill="rgba(58, 40, 20, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mango</text>

  <rect x="0" y="42" width="248" height="498" fill="#ffe8c5"/>
