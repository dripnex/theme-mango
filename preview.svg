  <text x="264" y="530" fill="rgba(58, 40, 20, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">128 words</text>
  <text x="944" y="530" text-anchor="end" fill="rgba(58, 40, 20, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mango</text>
