  <text x="26" y="100" fill="rgba(58, 40, 20, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Search notes</text>

  <rect x="8" y="128" width="232" height="56" rx="8" fill="rgba(240, 138, 40, 0.2)"/><rect x="8" y="128" width="3" height="56" rx="1.5" fill="#f08a28"/>
  <text x="22" y="152" fill="#f08a28" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Ripe mango</text><text x="22" y="170" fill="rgba(58, 40, 20, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Warm fruit on paper...</text>
  <text x="22" y="216" fill="#3a2814" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Fruit paper</text><text x="22" y="234" fill="rgba(58, 40, 20, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Peel first, then the mark.</text>
  <text x="22" y="280" fill="#3a2814" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Afternoon light</text><text x="22" y="298" fill="rgba(58, 40, 20, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Ink, pulp, then the page.</text>
  <text x="22" y="344" fill="#3a2814" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Coral flesh</text><text x="22" y="362" fill="rgba(58, 40, 20, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Keep the orange for marks.</text>

  <rect x="248" y="42" width="712" height="470" fill="#fff4e4"/>

  <text x="284" y="90" fill="#3a2814" font-size="28" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Ripe mango</text>
  <text x="284" y="114" fill="rgba(58, 40, 20, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Today &#183; Markdown</text>

  <text x="284" y="154" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The fruit paper had warmed when I sat down.</text>
  <text x="284" y="176" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">I wrote</text>
  <rect x="334" y="162" width="86" height="18" rx="4" fill="#ffdfb1"/>
  <text x="342" y="175" fill="#f08a28" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">openNote()</text>
  <text x="428" y="176" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">and let one mango stroke land.</text>

  <rect x="284" y="198" width="640" height="44" rx="6" fill="rgba(240, 138, 40, 0.1)"/>
  <rect x="284" y="198" width="4" height="44" rx="2" fill="#f08a28"/>
  <text x="302" y="225" fill="rgba(58, 40, 20, 0.52)" font-size="14" font-style="italic" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mango on warm paper. One mark is enough.</text>

  <circle cx="292" cy="268" r="3" fill="#f08a28"/>
  <text x="304" y="272" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">peel the fruit</text>
  <circle cx="292" cy="292" r="3" fill="#f08a28"/>
  <text x="304" y="296" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the note</text>
  <circle cx="292" cy="316" r="3" fill="#f08a28"/>
  <text x="304" y="320" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the quiet</text>

  <text x="284" y="358" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">See also</text>
  <text x="344" y="358" fill="#f08a28" font-size="14" text-decoration="underline" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Fruit paper</text>
  <text x="434" y="358" fill="#3a2814" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">when the jar cools.</text>

  <rect x="0" y="512" width="960" height="28" fill="#ffe8c5"/>
  <line x1="0" y1="512" x2="960" y2="512" stroke="rgba(58, 40, 20, 0.12)" stroke-width="1"/>
